datasets:
  batch_size: 256
  empirical_data_fn: /home/mouse9911/gits/spf/empirical_dists/full_20260809_v1.pkl
  empirical_individual_radio: false
  empirical_symmetry: true
  flip: false
  double_flip: true
  precompute_cache: /mnt/md2/cache/precompute_cache_3p7
  scatter: continuous
  scatter_k: 21
  shuffle: true
  sigma: 0.1
  skip_qc: true
  snapshots_adjacent_stride: 1
  train_snapshots_per_session: 1
  val_snapshots_per_session: 1
  random_snapshot_size: false
  snapshots_stride: 1
  train_paths:
  - /mnt/md2/splits/rover_2026q3_v1/train_apr17_plus_rover2026_n37.txt
  val_paths:
  - /mnt/md2/splits/rover_2026q3_v1/eval_apr17_plus_rover2026_n11.txt
  val_holdout_fraction: 0.5
  val_subsample_fraction: 0.5
  workers: 16
  segmentation_version: 3.7
global:
  beamformer_input: false
  vehicle_type_input: true
  gains_input: true
  windowed_beamformer_input: true
  empirical_input: false
  n_radios: 2
  nthetas: 65
  phase_input: false
  rx_spacing_input: true
  frequency_input: true
  signal_matrix_input: false
  sdr_device_type_input: true
  seed: 10
logger:
  log_every: 100
  name: wandb
  plot_every: 75000
  project: 2024_nov22_single_paired_multi
model:
  block: true
  bn: true
  depth: 4
  detach: true
  dropout: 0.0
  hidden: 512
  input_dropout: 0.2
  load_single: true
  name: pairedbeamformer
  norm: layer
  single:
    block: true
    bn: true
    depth: 4
    detach: true
    dropout: 0.0
    hidden: 512
    input_dropout: 0.1
    name: beamformer
    norm: layer
    windows_stats_net:
      windowed_beamformer: true
      normalize_windowed_beamformer: false
      hidden_channels: 64
      outputs: 12
      n_layers: 8
      norm: false
      act: leaky
      window_shrink: 0.5
      window_shuffle: 0.15
      window_dropout: 0.25
      window_fraction: 0.5
optim:
  amp: false
  checkpoint: /mnt/md0/checkpoints/rover_2026q3_v1/single_seed10/best.pth
  checkpoint_every: 5000
  device: cuda
  direct_loss: false
  dtype: torch.float32
  epochs: 60
  head_start: 0
  learning_rate: 0.0002
  loss: mse
  resume_step: 0
  output: /mnt/md0/checkpoints/rover_2026q3_v1/paired_seed10
  save_on: val/paired_loss
  scheduler_step: 12
  val_every: 25000
  weight_decay: 0.0
