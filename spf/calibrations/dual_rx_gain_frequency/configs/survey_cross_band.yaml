# Stage-focused Cartesian survey across the three AD9361 full gain tables.
#
# The gain set is the union of representative endpoints and LNA/mixer stage
# transitions in the 800, 2300, and 5500 MHz tables at Linux commit
# d798b0d821b85ebd51ecffbfa68d8e4d69b77132. It stays inside the measured
# common manual-gain range (-1..62 dB) of both attached radios.
data-version: 7

pluto-firmware:
  release-tag: v0.38-plutoplus-spf-gain-rssi-fingerprint-v2
  asset-name: plutoplus-spf-direct-usb-gain-rssi-fingerprint-v2-pluto.dfu
  image-url: https://github.com/misko/plutosdr-fw/releases/download/v0.38-plutoplus-spf-gain-rssi-fingerprint-v2/plutoplus-spf-direct-usb-gain-rssi-fingerprint-v2-pluto.dfu
  image-sha256: 5f8220bc3a9c23b891ad8a19e52eeb24ecfcd24b2ae5923a1e50e450f49a802d
  firmware-git-sha: 7b7fb14014b9a64d245ea1bd2045ff8ea3ef8880
  gadget-git-sha: 27a7eed7b6abcaf1b9c78f7978bf743a7a315325
  # Match the rover production configs: the image is persisted in mtd3 and
  # boot preparation only reflashes when the active image differs. Calibrate
  # against the same firmware state the rovers actually fly.
  boot-mode: qspi

calibration:
  frequencies-hz:
    - 868000000
    - 915000000
    - 1280000000
    - 1320000000
    - 2412000000
    - 2467000000
    - 3990000000
    - 4010000000
    - 5766000000
    - 5804000000
    - 5838000000
    - 5866000000
  gains-db: [-1, 0, 3, 5, 6, 15, 16, 17, 23, 25, 26, 27, 33, 34, 41, 52, 62]
  repetitions: 3
  sample-rate-hz: 30000000
  bandwidth-hz: 3000000
  buffer-size: 65536
  tone-offset-hz: 100000
  tone-search-width-hz: 25000
  transient-samples: 1024
  phase-segments: 8
  settle-seconds: 0.025
  frequency-settle-seconds: 0.5
  discard-frames-after-gain: 1
  max-retries: 1
  rf-dc-calibration-policy: before_each_frequency_block
  random-seed: 20260727
  tx-source: fpga_dds
  # The three completed 47-frequency scout epochs established 0 dB as the safe
  # reference: it keeps moderate asymmetric pairs measurable while the
  # adaptive policy still attenuates TX for the stronger receive channel.
  tx-gain-db: 0
  tx-gain-policy: adaptive_max_rx_gain
  tx-reference-rx-gain-db: 26
  tx-min-gain-db: -80
  tx-max-gain-db: 0
  tx-digital-amplitude: 16384
  min-quality-valid-per-cell: 2
  max-across-repeat-phase-std-deg: 5
  setup-label: two-pluto-tx2-30db-split-rx1-rx2-cross-band
  notes: TX2 -> 30 dB attenuator -> two-way splitter -> RX1/RX2
  quality:
    min-tone-snr-db: -10
    min-tone-dbfs: -75
    max-tone-dbfs: -3
    max-clipping-fraction: 0
    min-coherence: 0.98
    max-within-capture-phase-std-deg: 5
