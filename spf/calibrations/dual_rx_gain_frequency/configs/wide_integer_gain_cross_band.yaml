# Overnight, frequency-wide additive-cross calibration.
#
# This combines the 47-frequency boundary/ISM scout with exact historical
# wall-array LOs that were previously missing. At every frequency it measures
# every common integer gain from -1 through 62 dB in both receiver roles,
# plus explicit off-axis holdouts, across three separated epochs.
#
# 53 frequencies * 175 pairs * 3 epochs = 27,825 frames per radio.
