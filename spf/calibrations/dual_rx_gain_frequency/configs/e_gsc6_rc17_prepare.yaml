  image-url: https://github.com/misko/plutosdr-fw/releases/download/v0.38-plutoplus-spf-gain-series-v4-rc16/plutoplus-spf-main-867e18542311-pluto.dfu
  image-sha256: 27aca40915fd75fbcabfadef88fee96ff422c6058f83fab8a57a09b8d1eae911
  firmware-git-sha: 867e18542311c25f5c1980bbdcfffc823e56f0a2
  gadget-git-sha: 2e8e40ade5dcf3c7880a5ebb58419ad7c37ed552
  boot-mode: qspi
receivers:
- receiver-port: 2
  theta-in-pis: 0
  antenna-spacing-m: 0.035
  nelements: 2
  array-type: linear
  rx-gain-mode: slow_attack
  rx-buffers: 4
  rx-gain: -3
  buffer-size: 524288
  f-intermediate: 100000
  f-carrier: 5840000000.0
  f-sampling: 30000000.0
  bandwidth: 3000000.0
- receiver-port: 1
  theta-in-pis: 0.5
  antenna-spacing-m: 0.035
  nelements: 2
  array-type: linear
  rx-gain-mode: slow_attack
  rx-buffers: 4
  rx-gain: -3
  buffer-size: 524288
  f-intermediate: 100000
  f-carrier: 5840000000.0
  f-sampling: 30000000.0
  bandwidth: 3000000.0
n-thetas: 65
n-records-per-receiver: 3000
width: 4000
calibration-frames: 800
routine: bounce
drone-uri: serial
dry-run: false
data-version: 7
direct-usb:
  protocol-version: 3
  gain-observation-interval-samples: 2048
  gain-observation-capacity: 256
seconds-per-sample: 0.5
collector:
  type: rover
  version: '3.1'
  capture-profile: direct_usb_gain_series_v3
