# E-GSC8 -- does the 5766 MHz mixer ladder transfer to the rover's 5840 MHz carrier?
# 34 pairs x 4 LOs x 3 epochs = 408 frames/radio, 816 for the pair.
data-version: 7
pluto-firmware:
  release-tag: v0.38-plutoplus-spf-gain-series-v4-rc16
  device-fw: v0.38-plutoplus-spf-gain-series-v4-rc12-9-g867e1
  asset-name: plutoplus-spf-main-867e18542311-pluto.dfu
