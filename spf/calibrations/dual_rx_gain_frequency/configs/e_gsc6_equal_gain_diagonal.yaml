  setup-label: e-gsc6-equal-gain-diagonal-r17-r18-tx2-30db-TEE-rx1-rx2
  notes: 'E-GSC6 equal-gain diagonal. Diagonal cells (g,g) for every g != 26 are held-out
    pairs, so they are captured at every frequency and epoch but excluded from the fit; the
    existing additive-cross analysis then scores them on a model that never saw them. At a
    diagonal cell the shared-symmetric residual IS D(g,g) and the independent-RX residual
    IS C(g,g) = D(g,g) - A_session(g), so the falsifier is differenced against this run own
    harness rather than published A. Gain set derived from gain_tables_audited.json: brackets
    all three LNA transitions in every band (low 30/31 32/33 51/52; middle 29/30 31/32 49/50;
    high 22/23 25/26 40/41, the 25->26 pair straddled by 25 and 27 because 26 is the anchor),
    plus frozen-word controls at 8, 20 and 45 dB which hold (LNA,MIXER,TIA) constant in all
    three bands, plus both ends of the band-common -1..62 dB range. 24 LOs, >=8 per band,
    each band spanning >=2 periods of the 392.5 MHz ripple. HARNESS: the splitter is a bare
    SMA tee (~0 dB port-to-port isolation), NOT a divider. E-HCP1 bounded its cross-arm coupling
    at <=1.25 dB, frequency-flat, so it cannot explain A; but in the LOW band that bound (~1
    deg) and A (0.73 deg) are the same size, so a small low-band C(g,g) must not be over-read.
    FIRMWARE: RC17, RAM-loaded via the automate flow with e_gsc6_rc17_prepare.yaml, so firmware_verified
    is a genuine attestation rather than an assertion. This is NOT the rc12-9-g867e1 build
    the published A was measured on, so every comparison against PUBLISHED A is CROSS-FIRMWARE
    and must say so in the report. The same-session A -- which is what the decision rule actually
    grades on -- is unaffected, because it comes from this run''s own training cross.'
