# Complete AD9361 mid-band gain-state additive cross for the two primary
# 2.4 GHz operating channels.
#
# The active full gain table reports every integer dB value from -3 through
# 71. Each frequency/epoch captures both one-dimensional receiver axes around
# 26 dB plus explicit off-axis pairs held out from fitting.
#
# Per frequency/epoch:
#   - 149 training pairs: (gain, 26) and (26, gain);
#   - 56 held-out ordered pairs; and
#   - 205 total frames.
#
# Across two frequencies and three separated epochs this is 1,230 frames per
# physical radio. Pair order is deterministic-randomized within every block.
data-version: 7

pluto-firmware:
