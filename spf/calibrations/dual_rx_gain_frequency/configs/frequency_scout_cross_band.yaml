# Frequency-first survey before committing to a dense gain Cartesian grid.
#
# The grid covers common operational/ISM frequencies, broad points throughout
# every AD9361 gain-table band, and tightly spaced points around the 1.3 and
# 4.0 GHz table boundaries. Each frequency still receives the complete
# 3-by-3 representative gain grid in three time-separated randomized epochs.
