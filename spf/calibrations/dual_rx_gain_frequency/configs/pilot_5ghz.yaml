# Two-radio TX2 loopback calibration pilot. All IQ is direct USB protocol v2
# and every radio writes its own data-version-7 Zarr.
data-version: 7

pluto-firmware:
  release-tag: v0.38-plutoplus-spf-gain-rssi-fingerprint-v1
  asset-name: plutoplus-spf-direct-usb-gain-rssi-fingerprint-v1-pluto.dfu
  image-url: https://github.com/misko/plutosdr-fw/releases/download/v0.38-plutoplus-spf-gain-rssi-fingerprint-v1/plutoplus-spf-direct-usb-gain-rssi-fingerprint-v1-pluto.dfu
  image-sha256: 0a6a8939b31babed2ad7093d83941ebc809323d69804adcd8da5bcae0e48d3e9
  firmware-git-sha: 7b02276519a802aed83d47b6672c46e578ce4de0
  gadget-git-sha: a1e6417d07188bd72be70692e28c5d6ae9a5ec62
  boot-mode: ram

calibration:
  frequencies-hz:
    - 5766000000
    - 5804000000
    - 5838000000
    - 5866000000
  gains-db: [-10, 26, 62]
  repetitions: 3
  sample-rate-hz: 30000000
  bandwidth-hz: 3000000
  buffer-size: 65536
  tone-offset-hz: 100000
  tone-search-width-hz: 25000
  transient-samples: 1024
  phase-segments: 8
  settle-seconds: 0.025
  frequency-settle-seconds: 0.5
  discard-frames-after-gain: 1
  max-retries: 1
  rf-dc-calibration-policy: before_each_frequency_block
  random-seed: 20260727
  tx-source: fpga_dds
  # At 26 dB RX gain this puts the loopback tone near -34 dBFS. The adaptive
  # policy holds the stronger receiver near that target where TX range allows.
  tx-gain-db: -15
  tx-gain-policy: adaptive_max_rx_gain
  tx-reference-rx-gain-db: 26
  tx-min-gain-db: -80
  tx-max-gain-db: 0
  tx-digital-amplitude: 16384
  min-quality-valid-per-cell: 2
  max-across-repeat-phase-std-deg: 5
  setup-label: two-pluto-tx2-30db-split-rx1-rx2
  notes: TX2 -> 30 dB attenuator -> two-way splitter -> RX1/RX2
  quality:
    # Bench data shows the weaker side of a 36 dB gain imbalance at roughly
    # -70 dBFS and -6 dB per-sample SNR while repeated segmented phase remains
    # within 2.1 degrees. Coherence and phase-std remain the decisive gates.
    min-tone-snr-db: -10
    min-tone-dbfs: -75
    max-tone-dbfs: -3
    max-clipping-fraction: 0
    min-coherence: 0.98
    max-within-capture-phase-std-deg: 5
