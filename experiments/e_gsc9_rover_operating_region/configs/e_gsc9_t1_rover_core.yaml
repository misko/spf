  notes: >-
    E-GSC9 Tier 1, the headline run. Full 23x23 ordered cross over the rover's operating gains 40..62 at both rover carriers. Anchor 49 is the rover's RX2 median and sits inside the LNA=3 state that the whole operating region occupies. The 45-cell additive cross through 49 is training; the 484 remaining ordered pairs are held out so additivity is tested on directly measured rover cells. The 23 equal-gain cells are scattered through every block by build_schedule's shuffle, giving an anchor observation every 4.4 s median.
