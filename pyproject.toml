[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spf"
version = "0.0.1"
dependencies = [
 "pytest",
 "numpy>=1.25",
 "docker",
 "matplotlib",
 "pyyaml",
 "haversine",
 "torch>=2.2",
 "shapely",
 "attrs",
 "pymavlink>=2.4.42",
 "pyserial",
 "tqdm",
 "numba",
 "scipy",
 "zarr<=2.18.4", # newer versions remove support for lmdb
 "pyadi-iio",
 "libusb1>=3.1",
 "pyproj",
 "compress-pickle",
 "deepdiff",
 "torchvision",
 "lmdb",
 "pandas",
 "pytest-console-scripts",
 "pre-commit",
 "tensordict",
 "filterpy",
 "wandb",
 "boto3",
 "dotenv",
#"cupy"
]
requires-python = ">=3.10"
description = "Signal Processing Fun"
readme = "README.md"

[tool.pytest.ini_options]
markers = [
  "radio_hardware: requires explicitly enabled attached Pluto radio hardware",
  "radio_zarr: writes and reopens a short hardware-backed V7 Zarr artifact",
  "radio_interrupt: terminates a real attached-radio collector subprocess",
  "radio_crash_recovery: kills only the direct-USB daemon and verifies supervised rebind",
  "radio_soak: long-running attached-radio stability test",
]
