[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spf"
version = "0.0.1"
dependencies = [
 "pytest",
 "numpy>=1.25",
 "docker",
 "matplotlib",
 "pyyaml",
 "haversine",
 "torch>=2.2",
 "shapely",
 "attrs",
 "pymavlink>=2.4.42",
 "MAVProxy", # mavproxy.py GCS/fan-out CLI; manual install until 2026-08-04
 "future", # MAVProxy rline.py imports it but never declares it; newer pymavlink no longer supplies it
 "pyserial",
 "tqdm",
 "numba",
 "scipy",
 "zarr<=2.18.4", # newer versions remove support for lmdb
 # zarr 2.x imports numcodecs.blosc.cbuffer_sizes, which numcodecs 0.16 removed.
 # Unpinned, a fresh resolve installs 0.16.x and every capture dies at import
 # with ImportError: cannot import name 'cbuffer_sizes'. Pinning zarr without
 # pinning what zarr imports from is not a pin.
 "numcodecs<0.16",
 # Hardware-qualified with the SPF libiio 0.25/0.26 extension. The PyPI
 # pylibiio dependency satisfies packaging; install_spf_libiio.sh overlays the
 # matching modified C library and binding from an immutable source tag.
 "pyadi-iio==0.0.18",
 "pylibiio>=0.25,<0.27",
 "libusb1>=3.1",
 "pyproj",
 "compress-pickle",
 "deepdiff",
 "torchvision",
 "lmdb",
 "pandas",
 "pytest-console-scripts",
 "pre-commit",
 "tensordict",
 "filterpy",
 "wandb",
 "boto3",
 "dotenv",
#"cupy"
]
requires-python = ">=3.10"
description = "Signal Processing Fun"
readme = "README.md"

[tool.pytest.ini_options]
markers = [
  "radio_hardware: requires explicitly enabled attached Pluto radio hardware",
  "radio_zarr: writes and reopens a short hardware-backed V7 Zarr artifact",
  "radio_gain_series_v3: requires explicitly enabled protocol-v3 gain-series firmware",
  "radio_tandem_agc: requires explicitly enabled tandem-AGC v2 firmware",
  "radio_direct_ip: requires explicitly enabled direct-IP radio transport",
  "radio_direct_ip_ladder: parallel two-radio direct-IP rate/breakdown ladder",
  "radio_tx_loopback: explicitly enables a cabled and attenuated Pluto TX2 loopback",
  "radio_interrupt: terminates a real attached-radio collector subprocess",
  "radio_crash_recovery: kills only the direct-USB daemon and verifies supervised rebind",
  "radio_soak: long-running attached-radio stability test",
  "radio_rf_dc_tracking: writes AD9361 RF-DC tracking state (--radio-rf-dc-tracking)",
  "sitl_crash: stall detection/recovery against a simulated rover (--sitl-crash)",
]
