# Canonical Rover 3 production capture.
# data-version 7 implies direct-USB metadata protocol v2 for every receiver.
# Resting position offset from the fence centroid, metres (east, north).
# Keeps rovers from converging on the same point at mission start/end.
# Rover 3 = (-1, +1). Affects start/home/RTL only, never pattern geometry.
rest-offset-m: [-1.0, 1.0]

emitter:
  type: o4
  signal: digital

distance-finder:
  trigger: 2
  echo: 3

boundary: auto

pluto-firmware:
  release-tag: v0.38-plutoplus-spf-gain-rssi-v2
  asset-name: plutoplus-spf-direct-usb-gain-rssi-v2-pluto.dfu
  image-url: https://github.com/misko/plutosdr-fw/releases/download/v0.38-plutoplus-spf-gain-rssi-v2/plutoplus-spf-direct-usb-gain-rssi-v2-pluto.dfu
  image-sha256: f3cd4d689e7c9ad392edc00eeb6d20da178900fb092eb6afe38a8e003ddbfdf4
  firmware-git-sha: dd6b1f4db710abc20693888db08e8da2427e0dc3
  gadget-git-sha: 54610e01c6fd6a69df77f148ea0dc88f9cb18063
  boot-mode: ram

receivers:
  - receiver-port: 2
    theta-in-pis: 0
    antenna-spacing-m: 0.043
    nelements: 2
    array-type: linear
    rx-gain-mode: slow_attack
    rx-buffers: 4
    rx-gain: -3
    buffer-size: 524288
    f-intermediate: 100000
    f-carrier: 5.766e+9
    f-sampling: 30.0e+6
    bandwidth: 3.0e+6

  - receiver-port: 1
    theta-in-pis: 0.5
    antenna-spacing-m: 0.043
    nelements: 2
    array-type: linear
    rx-gain-mode: slow_attack
    rx-buffers: 4
    rx-gain: -3
    buffer-size: 524288
    f-intermediate: 100000
    f-carrier: 5.766e+9
    f-sampling: 30.0e+6
    bandwidth: 3.0e+6

n-thetas: 65
n-records-per-receiver: 3000
width: 4000
calibration-frames: 800
routine: bounce
drone-uri: serial
dry-run: false
data-version: 7
seconds-per-sample: 0.5

collector:
  type: rover
  version: "3.1"
  capture-profile: direct_usb_gain_rssi_v2
