# Canonical Rover 3 production capture.
# data-version 7 implies direct-USB metadata protocol v2 for every receiver.
# Resting position offset from the fence centroid, metres (east, north).
# Keeps rovers from converging on the same point at mission start/end.
# Rover 3 = (-1, +1). Affects start/home/RTL only, never pattern geometry.
rest-offset-m: [-1.0, 1.0]

emitter:
  type: o4
  signal: digital

distance-finder:
  trigger: 2
  echo: 3

boundary: auto

pluto-firmware:
  release-tag: v0.38-plutoplus-spf-gain-series-v4-rc12
  device-fw: v0.38-plutoplus-spf-gain-series-v4-rc11-2-gfa5f9
  asset-name: plutoplus-spf-main-fa5f95f0af2a-pluto.dfu
  image-url: https://github.com/misko/plutosdr-fw/releases/download/v0.38-plutoplus-spf-gain-series-v4-rc12/plutoplus-spf-main-fa5f95f0af2a-pluto.dfu
  image-sha256: 2209e23ccc76b9748b0b4435ff706f8edbd7ad0ce1b950ff4065a399d7de52d4
  firmware-git-sha: fa5f95f0af2a0586c80b54eff7ae04512cb96f7f
  gadget-git-sha: e14eae63ac6b7fe51828e85de34a8d4e1c50d49e
  # Persist in mtd3; boot preparation only reflashes when the active image differs.
  boot-mode: qspi

receivers:
  - receiver-port: 2
    theta-in-pis: 0
    antenna-spacing-m: 0.043
    nelements: 2
    array-type: linear
    # Deliberate A/B against rovers 1/2/4, which stay on slow_attack: with a
    # bursty O4 emitter the AGC spends most frames in the gaps, and slow_attack
    # may be too slow to settle on a burst. Watch for the persistent
    # fast-attack gain-lock states this config previously avoided -- if they
    # reappear on bursty digital video, revert this rover to slow_attack.
    rx-gain-mode: fast_attack
    rx-buffers: 4
    rx-gain: -3
    buffer-size: 524288
    f-intermediate: 100000
    f-carrier: 5.840e+9
    f-sampling: 30.0e+6
    bandwidth: 3.0e+6

  - receiver-port: 1
    theta-in-pis: 0.5
    antenna-spacing-m: 0.043
    nelements: 2
    array-type: linear
    # Deliberate A/B against rovers 1/2/4, which stay on slow_attack: with a
    # bursty O4 emitter the AGC spends most frames in the gaps, and slow_attack
    # may be too slow to settle on a burst. Watch for the persistent
    # fast-attack gain-lock states this config previously avoided -- if they
    # reappear on bursty digital video, revert this rover to slow_attack.
    rx-gain-mode: fast_attack
    rx-buffers: 4
    rx-gain: -3
    buffer-size: 524288
    f-intermediate: 100000
    f-carrier: 5.840e+9
    f-sampling: 30.0e+6
    bandwidth: 3.0e+6

n-thetas: 65
n-records-per-receiver: 3000
width: 4000
calibration-frames: 800
routine: bounce
drone-uri: serial
dry-run: false
data-version: 7
seconds-per-sample: 0.5

collector:
  type: rover
  version: "3.1"
  capture-profile: direct_usb_gain_rssi_v2
