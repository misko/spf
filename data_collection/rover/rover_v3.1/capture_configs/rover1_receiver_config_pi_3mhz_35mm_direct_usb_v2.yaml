# Rover 1 direct-USB protocol-v2 profile.
# RF, frame, pacing, geometry, and gain mode intentionally match
# rover_receiver_config_pi_3mhz_35mm.yaml.
emitter:
  type: o4
  signal: digital

distance-finder:
  trigger: 2
  echo: 3

boundary: auto

receivers:
  - receiver-port: 2
    rx-transport: direct_usb
    theta-in-pis: 0
    antenna-spacing-m: 0.035
    nelements: 2
    array-type: linear
    # Intentional: avoid persistent fast-attack gain-lock states seen on bursty digital video.
    rx-gain-mode: slow_attack
    rx-buffers: 4
    rx-gain: -3
    buffer-size: 524288
    f-intermediate: 100000
    f-carrier: 5.766e+9
    f-sampling: 30.0e+6
    bandwidth: 3.0e+6
    direct-usb:
      protocol-version: 2
      frame-count-per-request: 1
      require-gain-metadata: true
      firmware-base-git-sha: a098f87b2302dde8bc3f442133800f6386512960
      gadget-base-git-sha: 7339ab52678459da4c52a457f3259d52e7adf007
      firmware-image-sha256: f3cd4d689e7c9ad392edc00eeb6d20da178900fb092eb6afe38a8e003ddbfdf4

  - receiver-port: 1
    rx-transport: direct_usb
    theta-in-pis: 0.5
    antenna-spacing-m: 0.035
    nelements: 2
    array-type: linear
    # Intentional: avoid persistent fast-attack gain-lock states seen on bursty digital video.
    rx-gain-mode: slow_attack
    rx-buffers: 4
    rx-gain: -3
    buffer-size: 524288
    f-intermediate: 100000
    f-carrier: 5.766e+9
    f-sampling: 30.0e+6
    bandwidth: 3.0e+6
    direct-usb:
      protocol-version: 2
      frame-count-per-request: 1
      require-gain-metadata: true
      firmware-base-git-sha: a098f87b2302dde8bc3f442133800f6386512960
      gadget-base-git-sha: 7339ab52678459da4c52a457f3259d52e7adf007
      firmware-image-sha256: f3cd4d689e7c9ad392edc00eeb6d20da178900fb092eb6afe38a8e003ddbfdf4

n-thetas: 65
n-records-per-receiver: 600000
width: 4000
calibration-frames: 800
routine: null
drone-uri: serial
dry-run: false
data-version: 7
seconds-per-sample: 0.5

collector:
  type: rover
  version: "3.1"
  capture-profile: direct_usb_gain_rssi_v2
