# Matched benchmark copy of rover_single_receiver_config_pi_3mhz.yaml.
# This does not replace or modify the production Rover 3 configuration.
emitter:
  type: o4
  signal: digital

boundary: auto

receivers:
  - receiver-port: 2
    rx-transport: iio
    theta-in-pis: 0
    antenna-spacing-m: 0.05075
    nelements: 2
    array-type: linear
    rx-gain-mode: slow_attack
    rx-buffers: 4
    rx-gain: -3
    buffer-size: 524288
    f-intermediate: 100000
    f-carrier: 5.766e+9
    f-sampling: 30.0e+6
    bandwidth: 3.0e+6
    filter_fir_en: 1

benchmark:
  warmup-frames: 25
  measured-frames: 100
  snapshot-interval-seconds: 0.5

n-thetas: 65
n-records-per-receiver: 100
width: 4000
calibration-frames: 0
routine: null
drone-uri: serial
dry-run: false
data-version: 4
seconds-per-sample: 0.5

collector:
  type: rover
  version: "3.1"
