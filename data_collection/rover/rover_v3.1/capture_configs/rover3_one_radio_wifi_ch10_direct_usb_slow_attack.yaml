# Passive 2.4 GHz direct-USB metadata acceptance capture.
# Uses the normal Rover 3.1 frame and Zarr path with slow-attack AGC.
emitter:
  type: o4
  signal: digital

boundary: auto

receivers:
  - receiver-port: 2
    rx-transport: direct_usb
    theta-in-pis: 0
    antenna-spacing-m: 0.05075
    nelements: 2
    array-type: linear
    rx-gain-mode: slow_attack
    rx-buffers: 4
    rx-gain: -3
    buffer-size: 524288
    f-intermediate: 100000
    f-carrier: 2.457e+9
    f-sampling: 30.0e+6
    bandwidth: 20.0e+6
    filter_fir_en: 1
    direct-usb:
      protocol-version: 2
      frame-count-per-request: 1
      require-gain-metadata: true
      firmware-base-git-sha: a098f87b2302dde8bc3f442133800f6386512960
      gadget-base-git-sha: 7339ab52678459da4c52a457f3259d52e7adf007
      firmware-image-sha256: f3cd4d689e7c9ad392edc00eeb6d20da178900fb092eb6afe38a8e003ddbfdf4

benchmark:
  warmup-frames: 25
  measured-frames: 100
  snapshot-interval-seconds: 0.5

n-thetas: 65
n-records-per-receiver: 100
width: 4000
calibration-frames: 0
routine: null
drone-uri: serial
dry-run: false
data-version: 4
seconds-per-sample: 0.5

collector:
  type: rover
  version: "3.1"
