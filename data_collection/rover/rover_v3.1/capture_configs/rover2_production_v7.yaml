# Canonical Rover 2 production capture.
# data-version 7 implies direct-USB metadata protocol v2 for every receiver.
# Resting position offset from the fence centroid, metres (east, north).
# Keeps rovers from converging on the same point at mission start/end.
# Rover 2 = (+1, -1). Affects start/home/RTL only, never pattern geometry.
rest-offset-m: [1.0, -1.0]

emitter:
  type: o4
  signal: digital

distance-finder:
  trigger: 2
  echo: 3

boundary: auto

pluto-firmware:
  release-tag: v0.38-plutoplus-spf-gain-rssi-fingerprint-v1
  asset-name: plutoplus-spf-direct-usb-gain-rssi-fingerprint-v1-pluto.dfu
  image-url: https://github.com/misko/plutosdr-fw/releases/download/v0.38-plutoplus-spf-gain-rssi-fingerprint-v1/plutoplus-spf-direct-usb-gain-rssi-fingerprint-v1-pluto.dfu
  image-sha256: 0a6a8939b31babed2ad7093d83941ebc809323d69804adcd8da5bcae0e48d3e9
  firmware-git-sha: 7b02276519a802aed83d47b6672c46e578ce4de0
  gadget-git-sha: a1e6417d07188bd72be70692e28c5d6ae9a5ec62
  boot-mode: ram

receivers:
  - receiver-port: 2
    theta-in-pis: 0
    antenna-spacing-m: 0.05075
    nelements: 2
    array-type: linear
    rx-gain-mode: slow_attack
    rx-buffers: 4
    rx-gain: -3
    buffer-size: 524288
    f-intermediate: 100000
    f-carrier: 5.766e+9
    f-sampling: 30.0e+6
    bandwidth: 3.0e+6

n-thetas: 65
n-records-per-receiver: 3500
width: 4000
calibration-frames: 800
routine: circle
drone-uri: serial
dry-run: false
data-version: 7
seconds-per-sample: 0.5

collector:
  type: rover
  version: "3.1"
  capture-profile: direct_usb_gain_rssi_v2
