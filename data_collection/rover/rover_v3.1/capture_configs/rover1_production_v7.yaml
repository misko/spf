# Canonical Rover 1 production capture.
# data-version 7 implies direct-USB metadata protocol v2 for every receiver.
# Resting position offset from the fence centroid, metres (east, north).
# Keeps rovers from converging on the same point at mission start/end.
# Rover 1 = (+1, +1). Affects start/home/RTL only, never pattern geometry.
rest-offset-m: [1.0, 1.0]

emitter:
  type: o4
  signal: digital

distance-finder:
  trigger: 2
  echo: 3

boundary: auto

pluto-firmware:
  release-tag: v0.38-plutoplus-spf-gain-rssi-fingerprint-v2
  asset-name: plutoplus-spf-direct-usb-gain-rssi-fingerprint-v2-pluto.dfu
  image-url: https://github.com/misko/plutosdr-fw/releases/download/v0.38-plutoplus-spf-gain-rssi-fingerprint-v2/plutoplus-spf-direct-usb-gain-rssi-fingerprint-v2-pluto.dfu
  image-sha256: 5f8220bc3a9c23b891ad8a19e52eeb24ecfcd24b2ae5923a1e50e450f49a802d
  firmware-git-sha: 7b7fb14014b9a64d245ea1bd2045ff8ea3ef8880
  gadget-git-sha: 27a7eed7b6abcaf1b9c78f7978bf743a7a315325
  # Persist in mtd3; boot preparation only reflashes when the active image differs.
  boot-mode: qspi

receivers:
  - receiver-port: 2
    theta-in-pis: 0
    antenna-spacing-m: 0.035
    nelements: 2
    array-type: linear
    # Intentional: avoid persistent fast-attack gain-lock states seen on bursty digital video.
    rx-gain-mode: slow_attack
    rx-buffers: 4
    rx-gain: -3
    buffer-size: 524288
    f-intermediate: 100000
    f-carrier: 5.766e+9
    f-sampling: 30.0e+6
    bandwidth: 3.0e+6

  - receiver-port: 1
    theta-in-pis: 0.5
    antenna-spacing-m: 0.035
    nelements: 2
    array-type: linear
    # Intentional: avoid persistent fast-attack gain-lock states seen on bursty digital video.
    rx-gain-mode: slow_attack
    rx-buffers: 4
    rx-gain: -3
    buffer-size: 524288
    f-intermediate: 100000
    f-carrier: 5.766e+9
    f-sampling: 30.0e+6
    bandwidth: 3.0e+6

n-thetas: 65
n-records-per-receiver: 3000
width: 4000
calibration-frames: 800
routine: bounce
drone-uri: serial
dry-run: false
data-version: 7
seconds-per-sample: 0.5

collector:
  type: rover
  version: "3.1"
  capture-profile: direct_usb_gain_rssi_v2
